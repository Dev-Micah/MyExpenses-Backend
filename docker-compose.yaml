services:
  postgres:
    image: postgres:15
    container_name: myexpenses-db
    environment:
      POSTGRES_DB: myexpenses
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qwerty
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: myexpenses-app
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SCHEMA: myexpenses
      DB_USER: postgres
      DB_PASSWORD: qwerty